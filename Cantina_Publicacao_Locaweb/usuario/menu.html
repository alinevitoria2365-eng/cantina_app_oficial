        <button type="button" class="menu-btn cv-menu-btn" id="btnCardapio" onclick="abrirCardapio()">
            <span class="menu-icon cv-menu-icon">
                <svg viewBox="0 0 48 48" width="26" height="26" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="10" width="32" height="30" rx="3"/>

                    <line x1="32" y1="6" x2="32" y2="14"/>
                    <line x1="15" y1="28" x2="33" y2="28"/>

                </svg>
            </span>
            <span class="menu-text">Cardápio da Semana <span id="badgeCardapioUsuario" class="cv-cardapio-status-badge" style="display:none;"></span></span>
            <span class="menu-arrow cv-menu-arrow">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a4fbf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L16 12 L9 18"/></svg>

    <div class="footer-bar cv-back-bar">
        <button type="button" class="btn btn-outline cv-back-btn" onclick="window.location.href='../index.html'">

        </button>

    <script src="../js/app.js"></script>
    <script src="../js/cardapio.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (getLoggedInType() !== "usuario") {
                window.location.href = "login.html";
                return;
            }
            const nome = getLoggedInName();
            const greetingEl = document.getElementById("user-greeting");
            if (greetingEl && nome && nome !== "Usuário") {
                greetingEl.textContent = `Olá, ${nome}! Selecione uma operação`;
            }
        });
    </script>
