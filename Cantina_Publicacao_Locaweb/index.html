    <style>
        /* ===== TELA INICIAL ANIMADA (SPLASH SCREEN) ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(10, 30, 65, 0.72), rgba(10, 30, 65, 0.9)),
                url('tela-de-fundo-escuro.png') center center / cover no-repeat,
                #0a1e41;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        .splash-screen.splash-fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* A logo (imagem com fundo transparente) surge e cresce com a mesma animação original */
        .splash-logo-img {
            width: 230px;
            max-width: 70vw;
            height: auto;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45));
            animation: splashLogoGrow 4s ease-out forwards;
        }

        @keyframes splashLogoGrow {
            0%   { transform: scale(0.6); }
            100% { transform: scale(1.15); }
        }

        /* Linha que se expande suavemente sob a logo */
        .splash-underline {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #dbe4f5, transparent);
            margin-top: 18px;
            animation: splashUnderline 2s ease-out 1s forwards;
        }

        @keyframes splashUnderline {
            from { width: 0; opacity: 0; }
            to   { width: 180px; opacity: 0.9; }
        }

        /* Esconde o conteúdo da tela de login enquanto a splash está ativa */
        body.splash-active {
            overflow: hidden;
        }

        body.splash-active .container {
            opacity: 0;
            animation: none;
        }
    </style>
</head>

    <script>
        let perfilSelecionado = null;
        let usuarioSelecionadoIndex = null;
        let adminSelecionadoIndex = null;
        let timerLoginIndex = null;

        function selecionarUsuarioIndex(nome, el) {
            usuarioSelecionadoIndex = nome;

            // Remove destaque anterior nos cards de usuário
            document.querySelectorAll("#lista-usuarios-index .cv-user-card").forEach(c => c.classList.remove("selected"));

            // Destaque o card clicado
            if (el) el.classList.add("selected");

            // Atualiza select oculto
            const sel = document.getElementById("select-usuario");
            if (sel) sel.value = nome;

            // Atualiza o botão principal
            const btn = document.getElementById("btn-entrar");
            if (btn) {
                btn.textContent = `Entrar como ${nome} →`;
            }

            // Login automático após 260ms (feedback visual)
            if (timerLoginIndex) clearTimeout(timerLoginIndex);
            timerLoginIndex = setTimeout(function() {
                entrar();
            }, 260);
        }

        function selecionarAdminIndex(nome, el) {
            adminSelecionadoIndex = nome;

            // Remove destaque anterior nos cards de admin
            document.querySelectorAll("#lista-admins-index .cv-user-card").forEach(c => c.classList.remove("selected"));

            // Destaque o card clicado
            if (el) el.classList.add("selected");

            // Atualiza select oculto
            const sel = document.getElementById("select-admin");
            if (sel) sel.value = nome;

            // Atualiza o botão principal
            const btn = document.getElementById("btn-entrar");
            if (btn) {
                btn.textContent = `Entrar como ${nome} →`;
            }

            // Login automático após 260ms (feedback visual)
            if (timerLoginIndex) clearTimeout(timerLoginIndex);
            timerLoginIndex = setTimeout(function() {
                entrar();
            }, 260);
        }

        function selecionarPerfil(tipo, el) {
            perfilSelecionado = tipo;

            if (timerLoginIndex) {
                clearTimeout(timerLoginIndex);
                timerLoginIndex = null;
            }

            // Remove destaque de todos os cards de perfil
            document.querySelectorAll('.cv-select-btn').forEach(c => c.classList.remove('selected'));

            // Destaque o perfil selecionado
            el.classList.add('selected');

            // Atualiza o título do formulário
            const titulo = tipo === 'admin' ? 'Login Administrador' : 'Login Usuário';
            document.getElementById('form-title').textContent = titulo;

            const adminFields = document.getElementById('admin-fields');
            const usuarioFields = document.getElementById('usuario-fields');
            const testCreds = document.getElementById('test-creds');
            const btnEntrar = document.getElementById('btn-entrar');

            if (tipo === 'admin') {
                if (adminFields) adminFields.style.display = 'block';
                if (usuarioFields) usuarioFields.style.display = 'none';
                if (testCreds) {
                    testCreds.style.display = 'block';
                    document.getElementById('test-creds-text').textContent = 'Toque no seu nome na lista para acessar a gestão';
                }
                if (btnEntrar) {
                    btnEntrar.textContent = adminSelecionadoIndex ? `Entrar como ${adminSelecionadoIndex} →` : 'Toque no seu nome acima para entrar';
                }
            } else {
                if (adminFields) adminFields.style.display = 'none';
                if (usuarioFields) usuarioFields.style.display = 'block';
                if (typeof renderizarCardsUsuarios === 'function') {
                    renderizarCardsUsuarios('lista-usuarios-index', 'select-usuario', 'selecionarUsuarioIndex');
                }
                if (testCreds) {
                    testCreds.style.display = 'block';
                    document.getElementById('test-creds-text').textContent = 'Toque no seu nome na lista para acessar o sistema';
                }
                if (btnEntrar) {
                    btnEntrar.textContent = usuarioSelecionadoIndex ? `Entrar como ${usuarioSelecionadoIndex} →` : 'Toque no seu nome acima para entrar';
                }
            }

            // Mostra o formulário
            document.getElementById('login-form').classList.add('visible');
        }

        function voltarSelecao() {
            perfilSelecionado = null;
            usuarioSelecionadoIndex = null;
            adminSelecionadoIndex = null;
            if (timerLoginIndex) {
                clearTimeout(timerLoginIndex);
                timerLoginIndex = null;
            }
            document.querySelectorAll('.cv-select-btn').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('#lista-usuarios-index .cv-user-card').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('#lista-admins-index .cv-user-card').forEach(c => c.classList.remove('selected'));
            document.getElementById('login-form').classList.remove('visible');
            const selUser = document.getElementById('select-usuario');
            if (selUser) selUser.selectedIndex = 0;
            const selAdmin = document.getElementById('select-admin');
            if (selAdmin) selAdmin.selectedIndex = 0;
            const btn = document.getElementById('btn-entrar');
            if (btn) btn.textContent = 'Entrar →';
        }

        function entrar() {
            if (timerLoginIndex) {
                clearTimeout(timerLoginIndex);
                timerLoginIndex = null;
            }

            if (!perfilSelecionado) {
                alert('Selecione um perfil (Administrador ou Usuário).');
                return;
            }

            if (perfilSelecionado === 'usuario') {
                const selectUser = document.getElementById('select-usuario');
                const nome = usuarioSelecionadoIndex || (selectUser ? selectUser.value : '');
                if (!nome) {
                    alert('Por favor, selecione seu nome na lista!');
                    return;
                }
                if (fazerLogin(null, null, 'usuario', nome)) {
                    window.location.href = 'usuario/menu.html';
                }
                return;
            }

            if (perfilSelecionado === 'admin') {
                const selectAdmin = document.getElementById('select-admin');
                const nome = adminSelecionadoIndex || (selectAdmin ? selectAdmin.value : '');
                if (!nome) {
                    alert('Por favor, selecione seu nome na lista!');
                    return;
                }
                if (fazerLogin(null, null, 'admin', nome)) {
                    window.location.href = 'admin/menu.html';
                }
                return;
            }
        }

        // Enter navega entre os campos e dispara o login
        document.addEventListener('DOMContentLoaded', function() {
            window.addEventListener('pageshow', function() {
                if (typeof renderizarCardsUsuarios === 'function') {
                    renderizarCardsUsuarios('lista-usuarios-index', 'select-usuario', 'selecionarUsuarioIndex');
                }
            });
            window.addEventListener('storage', function() {
                if (typeof renderizarCardsUsuarios === 'function') {
                    renderizarCardsUsuarios('lista-usuarios-index', 'select-usuario', 'selecionarUsuarioIndex');
                }
            });

                renderizarCardsUsuarios('lista-usuarios-index', 'select-usuario', 'selecionarUsuarioIndex');
            }

        // ===== TELA INICIAL ANIMADA =====
        // 1) A logo (imagem) surge e cresce aos poucos (animação CSS de 4s)
        // 2) Após 4 segundos, aplica o fade out
        // 3) Ao terminar o fade out, remove a splash e revela a tela de login
        (function() {
            const splash = document.getElementById('splash-screen');
            if (!splash) return;

            setTimeout(function() {
                splash.classList.add('splash-fade-out');
            }, 4000);

            // Remove a splash do DOM assim que o fade out terminar
            splash.addEventListener('transitionend', function(e) {
                if (e.target !== splash) return;
                document.body.classList.remove('splash-active');
                splash.remove();
            });

            // Fallback caso o evento transitionend não dispare
            setTimeout(function() {
                if (document.body.contains(splash)) {
                    document.body.classList.remove('splash-active');
                    splash.remove();
                }
            }, 5200);
        })();
    </script>
