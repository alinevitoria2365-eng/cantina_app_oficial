    <script src="../js/app.js"></script>

    <script>
        // Proteger rota - verificar login
        document.addEventListener("DOMContentLoaded", function() {
            if (getLoggedInType() !== "admin") {
                window.location.href = "login.html";
                return;
            }
            const nome = getLoggedInName();
            const greetingEl = document.getElementById("admin-greeting");
            if (greetingEl && nome && nome !== "Administrador") {
                greetingEl.textContent = `Olá, ${nome}! Selecione uma operação`;
            }
        });
    </script>
