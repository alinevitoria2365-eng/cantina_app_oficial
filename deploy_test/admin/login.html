<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="cv-page-body">
    <div class="container cv-card cv-login-card">

        <!-- LOGOTIPO CORONEL VENÂNCIO -->
        <div class="cv-header">
            <img class="cv-shield" src="../logocv.png" alt="Logotipo Coronel Venâncio">
            <span class="cv-logo-title">Coronel Venâncio</span>
            <span class="cv-logo-underline"></span>
        </div>

        <h2 class="cv-page-title">Login Administrador</h2>
        <div class="cv-divider"><span></span><i></i><span></span></div>
        <p class="cv-page-subtitle">Selecione seu nome para acessar a gestão</p>

        <!-- LISTA DE CARDS DE ADMINISTRADORAS (ESTILO CORONEL VENÂNCIO) -->
        <div class="cv-user-cards-list" id="lista-admins-login">
            <button type="button" class="cv-user-card" data-nome="Rita" onclick="selecionarAdminLogin('Rita', this)">
                <div class="cv-user-avatar">
                    <span class="cv-user-initial">R</span>
                    <span class="cv-user-badge">👩‍💼</span>
                </div>
                <div class="cv-user-info">
                    <span class="cv-user-name">Rita</span>
                    <span class="cv-user-sub">Gestão & Administração</span>
                </div>
                <div class="cv-user-indicator">
                    <span class="cv-user-radio">
                        <svg class="cv-check-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    <span class="cv-user-arrow">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1a4fbf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 6 L16 12 L9 18"/>
                        </svg>
                    </span>
                </div>
            </button>

            <button type="button" class="cv-user-card" data-nome="Maria" onclick="selecionarAdminLogin('Maria', this)">
                <div class="cv-user-avatar">
                    <span class="cv-user-initial">M</span>
                    <span class="cv-user-badge">👩‍💼</span>
                </div>
                <div class="cv-user-info">
                    <span class="cv-user-name">Maria</span>
                    <span class="cv-user-sub">Gestão & Administração</span>
                </div>
                <div class="cv-user-indicator">
                    <span class="cv-user-radio">
                        <svg class="cv-check-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    <span class="cv-user-arrow">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1a4fbf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 6 L16 12 L9 18"/>
                        </svg>
                    </span>
                </div>
            </button>

            <button type="button" class="cv-user-card" data-nome="Roberta" onclick="selecionarAdminLogin('Roberta', this)">
                <div class="cv-user-avatar">
                    <span class="cv-user-initial">Ro</span>
                    <span class="cv-user-badge">👩‍💼</span>
                </div>
                <div class="cv-user-info">
                    <span class="cv-user-name">Roberta</span>
                    <span class="cv-user-sub">Gestão & Administração</span>
                </div>
                <div class="cv-user-indicator">
                    <span class="cv-user-radio">
                        <svg class="cv-check-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    <span class="cv-user-arrow">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1a4fbf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 6 L16 12 L9 18"/>
                        </svg>
                    </span>
                </div>
            </button>
        </div>

        <!-- SELECT OCULTO PARA COMPATIBILIDADE -->
        <select id="select-admin" class="cv-select-usuario" style="display:none;" aria-hidden="true">
            <option value="" disabled selected>Escolha seu nome...</option>
            <option value="Rita">Rita</option>
            <option value="Maria">Maria</option>
            <option value="Roberta">Roberta</option>
        </select>

        <div style="margin-top: 4px;">
            <button type="button" class="btn btn-primary" id="btn-entrar-admin" onclick="entrarAdmin()" style="display:none;">
                Entrar →
            </button>
        </div>

        <div class="test-creds">
            <strong>Equipe de Gestão</strong>
            Toque no seu nome para entrar diretamente
        </div>

        <div class="footer-bar cv-back-bar">
            <button type="button" class="btn btn-outline cv-back-btn" onclick="window.location.href='../index.html'">
                <span class="cv-back-icon">
                    <svg viewBox="0 0 24 24" width="22" height="20" fill="none" stroke="#12305c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 H4 M4 12 L10 6 M4 12 L10 18"/></svg>
                </span>
                <span class="cv-back-divider"></span>
                <span class="cv-back-text">Voltar ao Início</span>
            </button>
        </div>

        <div class="cv-footer">
            <div class="cv-footer-line"></div>
            <span class="cv-footer-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a4fbf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 2 V9 M3 2 V7 C3 8.5 4 9 5 9 M7 2 V7 C7 8.5 6 9 5 9"/>
                    <path d="M5 9 V22"/>
                    <path d="M17 2 C14.2 2 14 6 14 8.5 C14 10 15 10.5 16.5 10.5 V22"/>
                    <path d="M16.5 10.5 V2"/>
                </svg>
            </span>
            <div class="cv-footer-line"></div>
        </div>
        <p class="cv-footer-text">Qualidade, organização e cuidado em cada refeição.</p>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let adminSelecionado = null;
        let timerLoginAdmin = null;

        function selecionarAdminLogin(nome, el) {
            adminSelecionado = nome;

            // Remove destaque anterior
            document.querySelectorAll("#lista-admins-login .cv-user-card").forEach(c => c.classList.remove("selected"));

            // Destaque o card clicado
            if (el) el.classList.add("selected");

            // Atualiza select oculto
            const sel = document.getElementById("select-admin");
            if (sel) sel.value = nome;

            // Atualiza e mostra o botão
            const btn = document.getElementById("btn-entrar-admin");
            if (btn) {
                btn.style.display = "flex";
                btn.textContent = `Entrar como ${nome} →`;
            }

            // Login automático após 260ms (feedback visual)
            if (timerLoginAdmin) clearTimeout(timerLoginAdmin);
            timerLoginAdmin = setTimeout(function() {
                entrarAdmin();
            }, 260);
        }

        function entrarAdmin() {
            if (timerLoginAdmin) {
                clearTimeout(timerLoginAdmin);
                timerLoginAdmin = null;
            }

            const sel = document.getElementById("select-admin");
            const nomeAdmin = adminSelecionado || (sel ? sel.value : "");

            if (!nomeAdmin) {
                alert("Por favor, selecione seu nome na lista!");
                return;
            }

            if (fazerLogin(null, null, "admin", nomeAdmin)) {
                window.location.href = "menu.html";
            } else {
                alert("Erro ao realizar login!");
            }
        }
    </script>
</body>
</html>
