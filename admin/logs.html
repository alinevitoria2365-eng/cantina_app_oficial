<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Histórico de Atividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .report-table {
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }
        .report-table th {
            background: #eef1f6;
            color: #12305c;
            font-weight: 700;
            padding: 9px 10px;
            text-align: left;
            border-bottom: 2px solid #dbe1ea;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .report-table td {
            padding: 9px 10px;
            border-bottom: 1px solid #eaeef4;
            color: #2d3748;
            vertical-align: top;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        /* Larguras das colunas para caberem dentro do card */
        .report-table th:nth-child(1) { width: 17%; }
        .report-table th:nth-child(2) { width: 15%; }
        .report-table th:nth-child(3) { width: 16%; }
        .report-table th:nth-child(4) { width: 15%; }
        .report-table th:nth-child(5) { width: 37%; }
        /* Wrapper com rolagem horizontal caso a tela seja muito estreita */
        .table-wrap {
            overflow-x: auto;
        }
        .report-table tr:hover td {
            background: #f7f9fc;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: linear-gradient(135deg, #1a4fbf, #12305c);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(18, 48, 92, 0.2);
        }
        .stat-box .stat-value {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 26px;
            font-weight: 700;
        }
        .stat-box .stat-label {
            font-size: 12px;
            opacity: 0.92;
            margin-top: 4px;
        }
        .stat-box.green {
            background: linear-gradient(135deg, #48bb78, #38a169);
            box-shadow: 0 4px 14px rgba(56, 161, 105, 0.25);
        }
        .section-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            color: #12305c;
            font-size: 17px;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .acao-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .acao-login {
            background: #e6f0ff;
            color: #1a4fbf;
            border: 1px solid #b8d0f5;
        }
        .acao-entrada {
            background: #f0fff4;
            color: #276749;
            border: 1px solid #c6f6d5;
        }
        .acao-saida {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
        }
        .acao-pedido {
            background: #fffaf0;
            color: #dd6b20;
            border: 1px solid #feebc8;
        }
        .acao-aprovado {
            background: #f0fff4;
            color: #276749;
            border: 1px solid #c6f6d5;
        }
        .acao-rejeitado {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
        }
        .acao-alteracao {
            background: #faf5ff;
            color: #6b46c1;
            border: 1px solid #e9d8fd;
        }
        .btn-print {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #eef1f6;
            border: 1px solid #dbe1ea;
            border-radius: 8px;
            color: #12305c;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }
        .btn-print:hover {
            background: #e2e8f0;
        }
        .btn-clear {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            color: #c53030;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
            margin-left: 8px;
        }
        .btn-clear:hover {
            background: #fed7d7;
        }
        .no-data {
            text-align: center;
            padding: 24px;
            color: #a0aec0;
        }
        .no-data .icon {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .filtro-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filtro-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #dbe1ea;
            background: #fff;
            color: #4a5568;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filtro-btn.active {
            background: linear-gradient(135deg, #1a4fbf, #12305c);
            color: #fff;
            border-color: #12305c;
        }
        @media print {
            body::before, body::after { display: none !important; }
            .container { zoom: 1 !important; box-shadow: none !important; }
            .cv-header, .cv-back-bar, .cv-footer, .cv-footer-text, .filtro-bar, .btn-print, .btn-clear { display: none !important; }
        }
    </style>
</head>
<body class="cv-page-body">
    <div class="container cv-card">

        <!-- LOGOTIPO CORONEL VENÂNCIO -->
        <div class="cv-header">
            <img class="cv-shield" src="../logocv.png" alt="Logotipo Coronel Venâncio">
            <span class="cv-logo-title">Coronel Venâncio</span>
            <span class="cv-logo-underline"></span>
        </div>

        <h2 class="cv-page-title">Histórico de Atividades</h2>
        <div class="cv-divider"><span></span><i></i><span></span></div>
        <p class="cv-page-subtitle">Acessos e alterações realizadas no sistema</p>

        <!-- RESUMO -->
        <div id="resumo-logs" style="margin-bottom:8px;"></div>

        <!-- FILTROS -->
        <div class="filtro-bar" id="filtro-bar">
            <button class="filtro-btn active" data-filtro="todos" onclick="aplicarFiltro('todos')">Todos</button>
            <button class="filtro-btn" data-filtro="login" onclick="aplicarFiltro('login')">🚪 Acessos</button>
            <button class="filtro-btn" data-filtro="alteracoes" onclick="aplicarFiltro('alteracoes')">✏️ Alterações</button>
        </div>

        <!-- LISTA DE LOGS -->
        <div id="logs-lista"></div>

        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Histórico</button>
        <button class="btn-clear" onclick="limparHistorico()">🗑️ Limpar Histórico</button>

        <div class="footer-bar cv-back-bar">
            <button type="button" class="btn btn-outline cv-back-btn" onclick="window.location.href='menu.html'">
                <span class="cv-back-icon">
                    <svg viewBox="0 0 24 24" width="22" height="20" fill="none" stroke="#12305c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 H4 M4 12 L10 6 M4 12 L10 18"/></svg>
                </span>
                <span class="cv-back-divider"></span>
                <span class="cv-back-text">Voltar ao Menu</span>
            </button>
        </div>

        <div class="cv-footer">
            <div class="cv-footer-line"></div>
            <span class="cv-footer-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a4fbf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 2 V9 M3 2 V7 C3 8.5 4 9 5 9 M7 2 V7 C7 8.5 6 9 5 9"/>
                    <path d="M5 9 V22"/>
                    <path d="M17 2 C14.2 2 14 6 14 8.5 C14 10 15 10.5 16.5 10.5 V22"/>
                    <path d="M16.5 10.5 V2"/>
                </svg>
            </span>
            <div class="cv-footer-line"></div>
        </div>
        <p class="cv-footer-text">Qualidade, organização e cuidado em cada refeição.</p>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let filtroAtual = "todos";

        document.addEventListener("DOMContentLoaded", function() {
            if (getLoggedInType() !== "admin") {
                window.location.href = "login.html";
                return;
            }
            renderizarLogs();
        });

        function getAcaoBadge(acao) {
            const map = {
                login:      { classe: "acao-login",      label: "🚪 Acesso" },
                entrada:    { classe: "acao-entrada",    label: "📥 Entrada" },
                saida:      { classe: "acao-saida",      label: "📤 Saída" },
                pedido:     { classe: "acao-pedido",     label: "🛒 Pedido" },
                aprovado:   { classe: "acao-aprovado",   label: "✅ Aprovado" },
                rejeitado:  { classe: "acao-rejeitado",  label: "❌ Rejeitado" },
                alteracao:  { classe: "acao-alteracao",  label: "✏️ Alteração" }
            };
            const info = map[acao] || { classe: "acao-alteracao", label: acao };
            return `<span class="acao-badge ${info.classe}">${info.label}</span>`;
        }

        function filtrarLogs() {
            const logs = getLogs();
            if (filtroAtual === "login") {
                return logs.filter(l => l.acao === "login");
            }
            if (filtroAtual === "alteracoes") {
                return logs.filter(l => l.acao !== "login");
            }
            return logs;
        }

        function renderizarLogs() {
            const logs = getLogs();
            const filtrados = filtrarLogs().slice().reverse(); // mais recentes primeiro
            const container = document.getElementById("logs-lista");
            const resumo = document.getElementById("resumo-logs");

            // Resumo
            const listaAdmins = typeof getListaAdmins === "function" ? getListaAdmins() : ["Rita", "Maria", "Roberta"];
            const totalAcessos = logs.filter(l => l.acao === "login").length;
            const totalAlteracoes = logs.filter(l => l.acao !== "login").length;
            const acessosAdmin = logs.filter(l => l.acao === "login" && (l.usuario === "Administrador" || listaAdmins.includes(l.usuario))).length;
            const acessosUsuario = logs.filter(l => l.acao === "login" && l.usuario !== "Administrador" && !listaAdmins.includes(l.usuario)).length;

            resumo.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value">${totalAcessos}</div>
                        <div class="stat-label">Acessos ao Sistema</div>
                    </div>
                    <div class="stat-box green">
                        <div class="stat-value">${totalAlteracoes}</div>
                        <div class="stat-label">Alterações Registradas</div>
                    </div>
                </div>
                <div style="text-align:center;font-size:13px;color:#718096;margin-bottom:12px;">
                    👩‍🍳 Cozinha entrou <strong>${acessosUsuario}</strong> vez(es) &nbsp;|&nbsp; 🛡️ Gestão entrou <strong>${acessosAdmin}</strong> vez(es)
                </div>
            `;

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <div class="icon">📋</div>
                        <p>Nenhuma atividade registrada${filtroAtual !== "todos" ? " para este filtro" : ""}</p>
                        <p style="font-size:13px;margin-top:8px;">Os acessos e alterações aparecerão aqui automaticamente</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-wrap">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Usuário</th>
                            <th>Atividade</th>
                            <th>Detalhes</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtrados.forEach(log => {
                const destaque = log.acao === "login" ? 'style="background:#f7faff;"' : "";
                html += `
                    <tr ${destaque}>
                        <td>${log.data}</td>
                        <td>${log.hora}</td>
                        <td><strong>${log.usuario}</strong></td>
                        <td>${getAcaoBadge(log.acao)}</td>
                        <td>${log.detalhes}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function aplicarFiltro(filtro) {
            filtroAtual = filtro;
            document.querySelectorAll(".filtro-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.filtro === filtro);
            });
            renderizarLogs();
        }

        function limparHistorico() {
            if (confirm("Tem certeza que deseja apagar TODO o histórico de atividades? Esta ação não pode ser desfeita.")) {
                saveLogs([]);
                renderizarLogs();
                showToast("🗑️ Histórico de atividades apagado.");
            }
        }
    </script>
</body>
</html>
