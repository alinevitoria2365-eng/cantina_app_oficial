    <circle cx="200" cy="200" r="145" fill="#142a50"/>
    <!-- Anel interno fino -->
    <circle cx="200" cy="200" r="132" fill="none" stroke="#4a7bd0" stroke-width="1.5" opacity="0.85"/>
